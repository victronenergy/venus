# Usage tips:
# - working on something, and need that to be built first? Temporarily, insert
#   a stage before the others.
# - to make gitlab skip jobs, prepend its name with . (a dot).
# - gitlab: don't forget to set the builds option to clone instead of git fetch
#   see Project Settings -> Builds. Fixes issues new builds not being 100%
#   clean builds.
# - In Project Settings you can also increase the max build time, default 60
#   minutes, to, for example, 180 minutes. 

stages:
  - build

variables:
  CONFIG: scarthgap
  SHARED_DIR: /mnt/persistent/venus_ci_shared

  # With SSTATE=yes, the old shared state is reused, otherwise a new one will
  # be populated, but it only replace the current one after building succesfully.
  CI_SSTATE_DIR: ${SHARED_DIR}/sstate-cache-${CI_COMMIT_BRANCH}
  CI_SSTATE_TMPDIR: ${CI_SSTATE_DIR}-tmp
  CI_SSTATE_OLDDIR: ${CI_SSTATE_DIR}-old

  # the two below are passed to bitbake as env variables.
  DL_DIR: ${SHARED_DIR}/downloads
  PERSISTENT_DIR: ${CI_SSTATE_DIR}/persistent-${CI_COMMIT_BRANCH}

build-full:
  variables:
    SSTATE: "build from cache"
  script:
    - make CONFIG=${CONFIG} reconf fetch-all build/conf/bblayers.conf
    - if [ "$SSTATE" = "yes" ]; then
        export SSTATE_DIR=${CI_SSTATE_DIR} && make mc-venus;
      else
        rm -rf ${CI_SSTATE_TMPDIR};
        export SSTATE_DIR=${CI_SSTATE_TMPDIR} && make mc-venus;
      fi
    - if [ "$SSTATE" != "yes" ]; then
        [ -e ${CI_SSTATE_DIR} ] && mv -f ${CI_SSTATE_DIR} ${CI_SSTATE_OLDDIR};
        mv ${CI_SSTATE_TMPDIR} ${CI_SSTATE_DIR};
        [ -e ${CI_SSTATE_OLDDIR} ] && rm -rf ${CI_SSTATE_OLDDIR};
      fi
    - rm -rf build/tmp*
    - ./ci-populate-artifacts.sh $CONFIG
    - ./ci-upload-artifacts-to-build-feeds.sh $CI_COMMIT_REF_NAME
    - ./ci-upload-artifacts-to-www.sh
    # trigger a pipeline on venus-tests repo; master branch; and pass our branch in the BRANCH variable
    - "curl -X POST -F token=56bd8d45f917e9ff0ff396005a8c98 -F ref=master -F variables[BRANCH]=$CI_COMMIT_REF_NAME \
      -F variables[PUSH_TO_TESTING]=yes https://git.victronenergy.com/api/v4/projects/221/trigger/pipeline"
    - make clean
  stage: build
  tags:
    - vic-alm-build-p02
    - venus
  rules:
    - if: ( $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH =~ /^b[3-9]\.[0-9]+$/ ) && $CI_PIPELINE_SOURCE == "web"
      when: always
    - when: never

build-branch:
  script:
    - make CONFIG=scarthgap reconf fetch-all build/conf/bblayers.conf
    - export BBPATH_EXTRA="$PWD/sites/ci-mirror:" && export VENUS_CI_SSTATE_DIR=${CI_SSTATE_DIR} && make machines
    - ./ci-populate-artifacts.sh $CONFIG
    - ./ci-upload-artifacts-to-build-feeds.sh $CI_COMMIT_REF_NAME
    # trigger a pipeline on venus-tests repo; master branch; and pass our branch
    # in the BRANCH variable
    - "curl -X POST -F token=56bd8d45f917e9ff0ff396005a8c98 -F ref=master \
      -F variables[BRANCH]=$CI_COMMIT_REF_NAME https://git.victronenergy.com/api/v4/projects/221/trigger/pipeline"
  stage: build
  tags:
    - vic-alm-build-p02
    - venus
  except:
    - tags
    - master
    - /^b[3-9]\.[0-9]+$/

