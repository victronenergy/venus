# Package Management configuration
PACKAGE_CLASSES ?= "package_ipk"

#INHERIT += "cve-check"
require conf/distro/include/cve-extra-exclusions.inc
require conf/cve-venus-exclusions.inc
CVE_CHECK_REPORT_PATCHED = "0"

COPY_LIC_MANIFEST = "1"
COPY_LIC_DIRS = "1"

# Note: This used to be ci/deploy spefic, but if shared
# state is intended to be shared the common config must
# be the same.
#
# Note: dbg packages can be huge, so this used to be:
# INHIBIT_PACKAGE_DEBUG_SPLIT = "1", there wouldn't be
# any debug packages at all by that.
#
# That doesn't work well with gdb and valgrind, so lets
# build them, but empty the ones which aren't needed,
# see the venus-dbg-packages class for details.
VENUS_DBG_PACKAGES ?= "medium"
VENUS_DBG_PACKAGES_FILTER ?= "1"
INHERIT:append = "${@oe.utils.vartrue('VENUS_DBG_PACKAGES_FILTER', ' venus-dbg-packages', '', d)}"
